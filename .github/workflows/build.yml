name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            binary: target/release/tubefast.exe
          - os: macos-latest
            name: macos-arm64
            binary: target/release/tubefast
          - os: ubuntu-22.04
            name: linux-x64
            binary: target/release/tubefast
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install Rust
        run: |
          rustup toolchain install 1.90 --profile minimal
          rustup default 1.90
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Install appimagetool
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/
      - name: Package AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: linux/package.sh target/release/tubefast .
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: tubefast-linux-appimage
          path: Tubefast-x86_64.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: tubefast-${{ matrix.name }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
